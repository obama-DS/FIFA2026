version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: premier-league-ml-api:latest
    container_name: ml-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s